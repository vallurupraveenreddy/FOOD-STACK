# ---------- Server ----------
server.port=8080

# ---------- MySQL ----------
# Create the database first:  CREATE DATABASE food_ordering_db;
spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# 256-bit+ secret used to sign tokens. Change this in production and keep it out of source control.
jwt.secret=ChangeThisSuperSecretFoodAppJwtSigningKeyToSomethingLongAndRandom123!
jwt.expiration.ms=86400000

# ---------- CORS ----------
# Origin of the React (Vite) dev server
app.cors.allowed-origin=http://localhost:5173
